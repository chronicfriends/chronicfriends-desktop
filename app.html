<script>
/* ===== Per-user data isolation =====================================
   Every signed-in account gets its OWN private localStorage namespace,
   so on a shared device one user can never see another's journal,
   medications, chats, profile or settings. Only the session pointer
   (cf_auth_v1) and the UI language (cf_lang) stay shared. This patch
   must run before any app code reads storage.

   The Community feed is per-account data too: it now lives in the cloud
   (Firestore) keyed by uid, so posts (cf_posts_v1), their comments
   (cf_post_comments_v1) and their likes (cf_post_likes_v1) are namespaced
   per account like everything else — a new account on this device no longer
   inherits (or re-uploads) another account's local posts. A one-time
   per-account migration below carries each account's OWN legacy posts (and
   those posts' comments/likes) out of any old device-global store. */
(function () {
  try {
    var proto = window.Storage && Storage.prototype;
    if (!proto || proto.__cfNS) return;
    var origGet = proto.getItem, origSet = proto.setItem, origRemove = proto.removeItem;
    var SHARED = {                                   /* keys that intentionally stay global */
      cf_auth_v1: 1, cf_lang: 1,
      cf_creds_v1: 1,                                /* device-wide account registry: email → password hash */
      cf_posts_archive_v1: 1,                        /* permanent archive of deleted posts/comments — shared, never pruned */
      cf_account_cleanup_v2: 1,                      /* one-time account-cleanup flag — global so it runs once per device */
      cf_public_profiles_v1: 1,                     /* simulated users/{uid}/public/profile collection — name + avatar ref + lang ONLY */
      cf_public_avatars_v1: 1,                      /* simulated avatar Storage bucket (image only) referenced by cfavatar:<uid> */
      cf_review_ask_v1: 1,                          /* MKT7 review-ask throttle — device-wide, like the OS rating quota (max 3 per device) */
    };
    function uid() {
      try {
        var a = JSON.parse(origGet.call(window.localStorage, 'cf_auth_v1'));
        if (!a) return 'anon';
        if (a.role === 'doctor') return 'doc:' + String(a.email || a.license || a.name || '').toLowerCase().trim();
        return 'pat:' + String(a.email || '').toLowerCase().trim();
      } catch (e) { return 'anon'; }
    }
    function nk(key) {
      if (key == null) return key;
      key = '' + key;
      if (SHARED[key]) return key;                   /* shared — leave untouched */
      if (!/^cf[-_]/i.test(key)) return key;         /* not an app key — leave untouched */
      if (key.indexOf('cfns:') === 0) return key;    /* already namespaced */
      return 'cfns:' + uid() + ':' + key;            /* per-account private key */
    }
    proto.getItem = function (k) { return origGet.call(this, nk(k)); };
    proto.setItem = function (k, v) { return origSet.call(this, nk(k), v); };
    proto.removeItem = function (k) { return origRemove.call(this, nk(k)); };
    
    /* CFMIGR-FEED-V1 — reparto del feed global antiguo entre cuentas:
       cada cuenta se lleva SOLO sus posts/comentarios (por 'author').
       Los likes locales no se migran (no son atribuibles); el contador
       real vive en la nube. */
    try {
      var u0 = uid();
      if (u0 !== 'anon' && origGet.call(window.localStorage, 'cfns:' + u0 + ':cf_posts_v1') == null) {
        var gp = [];
        try { gp = JSON.parse(origGet.call(window.localStorage, 'cf_posts_v1')) || []; } catch (e) {}
        var mine = (Array.isArray(gp) ? gp : []).filter(function (p) {
          return p && (p.author === u0 || String(p.id || '').indexOf('seed') === 0);
        });
        origSet.call(window.localStorage, 'cfns:' + u0 + ':cf_posts_v1', JSON.stringify(mine));
        var gc = null;
        try { gc = JSON.parse(origGet.call(window.localStorage, 'cf_post_comments_v1')); } catch (e) {}
        var mc = {};
        if (gc && typeof gc === 'object') Object.keys(gc).forEach(function (pid) {
          var arr = (gc[pid] || []).filter(function (c) { return c && c.author === u0; });
          if (arr.length) mc[pid] = arr;
        });
        origSet.call(window.localStorage, 'cfns:' + u0 + ':cf_post_comments_v1', JSON.stringify(mc));
      }
    } catch (e) {}
    proto.__cfNS = true;
    window.CFNS = { uid: uid, prefix: function () { return 'cfns:' + uid() + ':'; } };

    /* One-time-per-account migration for the Community feed. The feed used to
       be device-global (cf_posts_v1 / cf_post_comments_v1 / cf_post_likes_v1
       lived in SHARED); it is now namespaced per account. On a device that
       still holds the OLD global store, copy into THIS account only the posts
       it authored — plus those posts' comments and likes — the first time the
       account loads. Prevents a new account inheriting (and re-uploading under
       its own uid) other accounts' posts. Idempotent; the old store is left
       intact so no other account loses or mixes data. Runs every load (each
       account switch reloads), guarded by a per-account done marker. */
    (function migrateCommunityFeed() {
      try {
        var u = uid();
        if (u === 'anon') return;                                           /* no signed-in account → nothing to migrate into */
        var doneKey = 'cfns:' + u + ':cf_posts_migrated_v1';
        if (origGet.call(window.localStorage, doneKey)) return;             /* already migrated for this account */
        var nsPosts = 'cfns:' + u + ':cf_posts_v1';
        if (origGet.call(window.localStorage, nsPosts) != null) {           /* account already has its own namespaced feed */
          origSet.call(window.localStorage, doneKey, '1'); return;
        }
        var posts = null;
        try { posts = JSON.parse(origGet.call(window.localStorage, 'cf_posts_v1')); } catch (e) {} /* the OLD device-global feed */
        if (!Array.isArray(posts) || !posts.length) {
          origSet.call(window.localStorage, doneKey, '1'); return;          /* nothing legacy to carry over */
        }
        var mine = posts.filter(function (p) { return p && p.author === u; });
        if (mine.length) {
          var ids = {};
          mine.forEach(function (p) { ids[p.id] = 1; });
          var allC = {}, allL = {}, myC = {}, myL = {};
          try { allC = JSON.parse(origGet.call(window.localStorage, 'cf_post_comments_v1')) || {}; } catch (e) {}
          try { allL = JSON.parse(origGet.call(window.localStorage, 'cf_post_likes_v1')) || {}; } catch (e) {}
          Object.keys(allC).forEach(function (pid) { if (ids[pid]) myC[pid] = allC[pid]; }); /* only this account's posts' threads */
          Object.keys(allL).forEach(function (pid) { if (ids[pid]) myL[pid] = allL[pid]; }); /* only this account's posts' likes */
          origSet.call(window.localStorage, nsPosts, JSON.stringify(mine));
          origSet.call(window.localStorage, 'cfns:' + u + ':cf_post_comments_v1', JSON.stringify(myC));
          origSet.call(window.localStorage, 'cfns:' + u + ':cf_post_likes_v1', JSON.stringify(myL));
        }
        origSet.call(window.localStorage, doneKey, '1');                    /* mark done — one time per account */
      } catch (e) {}
    })();
  } catch (e) {}
})();

/* (Removed) A one-time account-cleanup routine used to live here. It deleted
   every account on the device except a hardcoded keep-list, which wiped
   user-created test accounts. It has been removed so it can never run again. */
</script>
